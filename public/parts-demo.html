<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts demo</title>
<style>
:root {
  --bg: #05080b; --panel: #081017; --line: #12303a; --cyan: #38d6f5; --cyan-dim: #1f6f80; --orange: #ff6a3d;
  --text: #e6e9eb; --muted: #9aa4ab; --seg: #0a1820; --seg-hover: #10303c;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0 }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; max-width: 640px }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px }
#root { display: grid; gap: 20px }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.gauges { display: flex; gap: 8px }
</style>
<link rel="stylesheet" href="parts.css">
</head><body>
<main id="root"></main>
<script src="parts.js"></script>
<script>
const P = parts, root = document.getElementById('root')
const g = document.createElement('div'); g.className = 'gauge'
g.innerHTML = '<svg viewBox="0 0 120 72" role="img" aria-label="cache read share"></svg><div class="label">cache read share</div>'
P.gauge(g.querySelector('svg'), .62)
const gauges = document.createElement('div'); gauges.className = 'gauges'; gauges.append(g)
const sel = document.createElement('select'); sel.setAttribute('aria-label', 'Model'); sel.innerHTML = '<option>sonnet</option><option>opus</option>'
const row = document.createElement('div'); row.className = 'row'
row.append(P.button('Plain'), P.button('Run', { go: true }), sel, P.copyButton('copied from the demo'),
  P.button('Open modal', { onClick: () => P.modal({ title: 'Confirm', body: '<p>Escape closes this. Focus returns to the button.</p>' }) }))
root.append(
  P.panel('Panel', '<p class="label" style="font-size:12px;color:var(--muted)">Body text in a chamfered panel.</p>'),
  P.card({ name: 'skill-name', meta: '12 runs, 3 d ago' }),
  gauges, row,
  P.commentBox({ placeholder: 'Write a note', onSubmit: v => alert(v) })
)
</script></body></html>
